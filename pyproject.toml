[project]
name = "check-updates"
dynamic = ["version"]
description = "Check and update Python project dependencies with a native Rust CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "narumi", email = "toucans-cutouts0f@icloud.com" }]
dependencies = []

[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "src/**/*.rs" },
]

[tool.bumpversion]
current_version = "0.0.5"
tag = true
commit = true
pre_commit_hooks = ["cargo update --workspace", "uv lock", "git add Cargo.lock uv.lock"]

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
