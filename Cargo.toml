[package]
name = "py-check-updates"
version = "0.0.5"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/narumiruna/check-updates"
description = "Check and update Python project dependencies"
license = "MIT"
readme = "README.md"

[lib]
name = "check_updates"

[[bin]]
name = "check-updates"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
comfy-table = "8"
crossterm = "0.29"
dunce = "1"
glob = "0.3"
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
scraper = "0.29"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
similar = "3"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
toml_edit = "0.25"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
