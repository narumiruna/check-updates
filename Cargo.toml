[package]
name = "check-updates"
version = "0.0.4"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/narumiruna/check-updates"
description = "Check and update Python project dependencies"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
comfy-table = "7"
crossterm = "0.29"
glob = "0.3"
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
scraper = "0.24"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "2"
toml_edit = "0.25"
url = "2"

[dev-dependencies]
tempfile = "3"
